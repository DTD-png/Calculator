<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>
<div id="main">
    <div id="lower-rectangle">
        <div class="putsThatMightWork">
            <div id="input" style="color: white;"></div>
            <div id="output" style="color: white; font-weight: bold;"></div>
        </div>

        <div class="buttons">
            <button class="symbol" style="background-color: orange;" onclick="one()">1</button>
            <button class="symbol" style="background-color: orange;" onclick="two()">2</button>
            <button class="symbol" style="background-color: orange;" onclick="three()">3</button>
            <button class="symbol" style="background-color: lightgrey;" onclick="plus()">+</button>
            <button class="symbol" style="background-color: lightgrey;" onclick="multi()">x</button>
            <button class="symbol" style="background-color: grey; color: white;" onclick="remove()">DEL</button>
        </div>

        <div class="buttons">
            <button class="symbol" style="background-color: orange;" onclick="four()">4</button>
            <button class="symbol" style="background-color: orange;" onclick="five()">5</button>
            <button class="symbol" style="background-color: orange;" onclick="six()">6</button>
            <button class="symbol" style="background-color: lightgrey;" onclick="minus()">-</button>
            <button class="symbol" style="background-color: lightgrey;" onclick="divide()">/</button>
            <button class="symbol" style="background-color: black; color: white;" onclick="up()">Ʌ</button>
        </div>

        <div class="buttons">
            <button class="symbol" style="background-color: orange;" onclick="seven()">7</button>
            <button class="symbol" style="background-color: orange;" onclick="eight()">8</button>
            <button class="symbol" style="background-color: orange;" onclick="nine()">9</button>
            <button class="symbol" style="background-color: lightgrey;" onclick="power()">^</button>
            <button class="symbol" style="background-color: lightgrey;" onclick="modulus()">%</button>
            <button class="symbol" style="background-color: black; color: white;" onclick="down()">V</button>
        </div>

        <div class="buttons">
            <button class="symbol" style="background-color: grey; color: white;" onclick="allClear()">AC</button>
            <button class="symbol" style="background-color: orange; color: black;" onclick="zero()">0</button>
            <button class="symbol" style="background-color: lightgrey;" onclick="decimal()">.</button>
            <button class="symbol" style="background-color: lightgrey;" onclick="leftP()">(</button>
            <button class="symbol" style="background-color: lightgrey;" onclick="rightP()">)</button>
            <button class="symbol" style="background-color: grey; color: white;" onclick="GO()">GO</button>
        </div>
    </div>
</div>
</body>
</html>
